llm:
  provider: deepseek
  model: deepseek-chat
  # api_key 优先从环境变量 MINICLAW_API_KEY 读取
  base_url: https://api.deepseek.com/v1
  temperature: 0.3
  max_tokens: 8192
  fallback_providers:
    - provider: openai
      model: gpt-4o-mini
      base_url: https://api.openai.com/v1
      # Put this in MINICLAW_API_KEY (or a local, untracked config file).
      api_key: ""

gateway:
  host: 127.0.0.1
  port: 18789

agent:
  max_tool_rounds: 15
  max_context_tokens: 80000
  heartbeat_interval_min: 30
  thinking: adaptive
  task_timeout_sec: 600         # 单次 Agent 任务整体超时
  sse_keepalive_sec: 15         # SSE 流无事件时的断连检测间隔
  planning:
    max_tool_rounds: 5
    temperature: 0.3

execution:
  default_timeout_sec: 60       # execute 工具默认超时
  max_timeout_sec: 900          # execute 工具最大超时

# GPUMD 等内部知识库使用的远程向量接口。
# 密钥请放在 MINICLAW_EMBEDDING_API_KEY 或 ARK_API_KEY 环境变量中。
rag:
  enabled: true
  base_url: https://ark.cn-beijing.volces.com/api/v3
  model: doubao-embedding-vision-251215
  # auto 会让带日期的 doubao-embedding-vision 模型使用 /embeddings/multimodal。
  api_type: auto
  api_key: ""
  dimension: 2048
  batch_size: 16
  max_concurrency: 4

evolution:
  enabled: true
  auto_observe: true
  inject_verified: true
  max_injected: 3
  auto_evaluate_applied: true
  deep_reflection_enabled: false
  deep_reflection_timeout_sec: 20
  canary_enabled: false
  canary_traffic_percent: 10
  canary_min_trials: 5
  canary_max_failures: 2
  canary_min_success_rate: 0.8
  replay_enabled: false
  replay_timeout_sec: 120
  maintenance_enabled: true
  maintenance_interval_hours: 24
  candidate_ttl_days: 90
  verified_review_days: 180
  trace_retention_days: 90
  skill_min_experiences: 2
  auto_skill_drafts_enabled: true
    executable_policy_timeout_sec: 30
    # Source-code evolution is opt-in and always uses an isolated Git worktree.
    source_evolution_enabled: false
    source_repo_path: ""
    source_failure_min_occurrences: 3
    source_failure_min_projects: 2
    source_patch_max_files: 8
    source_patch_max_changed_lines: 500
    source_test_timeout_sec: 300

channels:
  enabled:
    webchat: true
    telegram: false
    wechat: false
