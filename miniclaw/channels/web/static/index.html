<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MiniClaw</title>
  <link rel="stylesheet" href="/static/style.css" />
  <script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked@12.0.0/marked.min.js"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/styles/atom-one-dark.min.css" />
  <script src="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/highlight.min.js"></script>
</head>
<body>
  <div id="app">
    <aside id="sidebar" class="sidebar">
      <div class="brand-block">
        <div class="brand-mark" aria-hidden="true">M</div>
        <div class="brand-copy">
          <strong>MINICLAW</strong>
          <span>AGENT WORKBENCH</span>
        </div>
      </div>
      <div class="sidebar-head">
        <h3>历史对话</h3>
        <button type="button" id="sidebar-toggle" class="icon-btn" title="折叠/展开">◀</button>
      </div>
      <button type="button" id="new-chat" class="primary-btn">+ 新对话</button>
      <div class="sidebar-caption">CONVERSATIONS</div>
      <div id="conv-list" class="conv-list"></div>
      <div class="sidebar-footer">
        <span class="live-dot"></span>
        <span>本地 Agent 已连接</span>
      </div>
    </aside>

    <div id="main-row" class="main-row">
      <section id="chat-panel" class="panel chat-panel">
        <div class="panel-head chat-head">
          <div class="section-title">
            <span class="eyebrow">ACTIVE WORKSPACE</span>
            <h2>工作会话</h2>
            <span id="current-chat-label" class="current-chat-label">webchat:default</span>
          </div>
          <div class="runtime-status" title="运行统计每 30 秒更新一次">
            <span id="runtime-dot" class="runtime-dot"></span>
            <span id="runtime-summary">系统就绪，等待任务</span>
          </div>
          <div class="chat-actions">
            <button type="button" id="btn-fork" class="ghost-btn" title="分叉当前对话">🔀 分叉</button>
            <button type="button" id="btn-export" class="ghost-btn" title="导出当前对话">📥 导出</button>
            <button type="button" id="btn-delete-chat" class="ghost-btn" title="删除当前对话">🗑</button>
          </div>
        </div>
        <div id="messages" class="messages"></div>
        <section id="quick-actions" class="quick-actions" aria-label="常用任务">
          <div class="quick-actions-label">快速开始</div>
          <button class="quick-action" type="button" data-prompt="分析当前工作区的项目结构，并告诉我下一步最值得做什么。"><span>◈</span> 分析工作区</button>
          <button class="quick-action" type="button" data-prompt="检查当前模拟或计算任务的状态，并简洁汇报异常和下一步建议。"><span>↗</span> 检查任务状态</button>
          <button class="quick-action" type="button" data-prompt="浏览工作区中最新的结果文件，建议最适合生成的可视化。"><span>◌</span> 生成可视化</button>
          <button class="quick-action" type="button" data-prompt="为我整理一个今天的工作摘要：已完成、进行中和待办事项。"><span>▤</span> 整理工作摘要</button>
        </section>
        <div class="panel-status chat-status">
          <div class="progress-track"><div id="chat-progress" class="progress-bar"></div></div>
          <span id="chat-status-text" class="status-text">就绪</span>
        </div>
        <div class="input-row">
          <textarea id="input" rows="1" placeholder="输入消息... (Enter 发送, Shift+Enter 换行)" autofocus></textarea>
          <button type="button" id="btn-send" class="primary-btn">发送</button>
        </div>
      </section>

      <section id="viz-panel" class="panel viz-panel">
        <div class="panel-head">
          <h2>可视化</h2>
          <div class="file-browser">
            <div class="file-browser-nav">
              <button id="browse-up" type="button" class="icon-btn" title="上级目录" disabled>↑</button>
              <span id="browse-path" class="browse-path" title="">工作区</span>
              <button id="refresh-files" type="button" class="ghost-btn">刷新</button>
            </div>
            <div class="file-browser-row">
              <select id="file-select">
                <option value="">— 进入子文件夹或选择文件 —</option>
              </select>
              <button id="load-viz" type="button" class="ghost-btn">加载</button>
            </div>
          </div>
        </div>
        <div class="panel-status viz-status">
          <div class="progress-track"><div id="viz-progress" class="progress-bar"></div></div>
          <span id="viz-status-text" class="status-text">无渲染任务</span>
        </div>
        <div class="viz-tabs">
          <button class="tab active" data-tab="media">媒体 <span id="media-count" class="tab-badge">0</span></button>
          <button class="tab" data-tab="structure">结构 3D <span id="structure-count" class="tab-badge">0</span></button>
        </div>
        <div id="tab-media" class="tab-pane active">
          <div id="media-gallery" class="media-gallery">
            <p class="placeholder">Agent 生成的 GIF / 曲线图将显示在这里</p>
          </div>
        </div>
        <div id="tab-structure" class="tab-pane">
          <div class="structure-controls">
            <span class="structure-controls-label">原子半径</span>
            <button id="atom-radius-dec" type="button" class="icon-btn">−</button>
            <input type="range" id="atom-radius-slider" min="0.05" max="6" step="0.05" value="0.30" />
            <button id="atom-radius-inc" type="button" class="icon-btn">+</button>
            <button id="atom-radius-reset" type="button" class="ghost-btn">重置</button>
            <span id="atom-radius-value" class="atom-radius-value">0.30</span>
          </div>
          <div id="structure-gallery" class="structure-gallery">
            <p class="placeholder">手动加载或 Agent 输出的结构将保留在此</p>
          </div>
        </div>
      </section>
    </div>
  </div>
  <script src="/static/app.js"></script>
</body>
</html>
